name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CLAUDE_CODE_VERSION: "2.1.237"
      OPENCODE_VERSION: "1.18.22"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python validation dependency
        run: python3 -m pip install -r requirements-dev.txt

      - name: Cache global npm validators
        id: cache-npm-global
        uses: actions/cache@v6
        with:
          path: ~/.npm-global
          key: npm-global-${{ runner.os }}-claude-${{ env.CLAUDE_CODE_VERSION }}-opencode-${{ env.OPENCODE_VERSION }}

      - name: Install pinned Claude Code and OpenCode
        if: steps.cache-npm-global.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.npm-global"
          npm install -g --prefix "$HOME/.npm-global" \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" \
            "opencode-ai@${OPENCODE_VERSION}"

      - name: Expose global npm binaries
        run: |
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          claude --version
          opencode --version

      - name: Run Python unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run OpenCode loader Node tests
        run: node --test tests/opencode-loader.test.js

      - name: Metadata sync check
        run: python3 scripts/sync-plugin-metadata.py --check

      - name: Agent Plugins check
        run: bash scripts/check-agent-plugins.sh

      - name: Claude plugins check
        run: bash scripts/check-claude-plugins.sh

      - name: Codex plugins check
        run: env -u CODEX_PLUGIN_VALIDATOR HOME=/tmp/empty-home bash scripts/check-codex-plugins.sh

      - name: Cookbooks check
        run: bash scripts/check-cookbooks.sh

      - name: Cursor plugins check
        run: bash scripts/check-cursor-plugins.sh

      - name: OpenCode loader check
        run: bash scripts/check-opencode-loader.sh

      - name: README contract check
        run: bash scripts/check-readme.sh

      - name: Assert clean worktree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: validation left the worktree dirty"
            git status --porcelain
            exit 1
          fi
